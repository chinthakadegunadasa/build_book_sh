name: Build Universal KDP Book

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      book_title:
        description: 'Book Title'
        required: false
        default: 'The Ultimate DevOps Practitioner\'s Handbook'
        type: string
      build_profile:
        description: 'Build Profile (kdp or draft)'
        required: false
        default: 'kdp'
        type: string

jobs:
  build-kdp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            libreoffice \
            ghostscript \
            pdftk-java \
            poppler-utils \
            fontconfig \
            ttf-mscorefonts-installer
          sudo fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --no-cache-dir python-docx Pillow uno

      - name: Run KDP Build Script
        env:
          BOOK_TITLE: "${{ github.event.inputs.book_title || 'The Ultimate DevOps Practitioner\'s Handbook' }}"
          BUILD_PROFILE: "${{ github.event.inputs.build_profile || 'kdp' }}"
          OUTPUT_FORMAT: "all"
        run: |
          chmod +x build_book.sh
          ./build_book.sh --profile "${{ env.BUILD_PROFILE }}" --format all

      - name: Upload KDP Publication Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kdp-book-artifacts
          path: |
            *.pdf
            *.docx
            *.epub
            build_report.txt
            
      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pdf
            *.docx
            *.epub
            build_report.txt
          generate_release_notes: true
